name: results

# 前日以前の結果を集計して成績タブを更新する。
# ミッドナイト競輪が23:25頃まであるため、日付が変わってから走らせる。
# AI判断を一切使わない純Python処理なので、Macが閉じていても必ず動く。
#
# 【GitHubのcron遅延について】
# スケジュール時刻から3〜4時間遅れて発火するのが常態（実測）。結果集計は
# 締め切りのある処理ではないので実害はないが、時刻はあてにしないこと。
on:
  workflow_dispatch:
  schedule:
    # 16:00 UTC = 翌01:00 JST（遅延を見込むと実際は朝4〜5時JST着）
    - cron: "0 16 * * *"

permissions:
  contents: write

jobs:
  results:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    concurrency:
      group: race-scout-write
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 未集計分を集計
        run: python3 results.py --auto

      - name: 生成物を退避
        # コミット処理がリモート最新から作り直すため、素材を別の場所に逃がす
        run: |
          mkdir -p staging
          cp -f results/*.json staging/ 2>/dev/null || true
          ls -la staging/ || echo "(集計対象なし)"

      - name: コミットして push
        run: |
          git config user.name "race-scout-bot"
          git config user.email "actions@users.noreply.github.com"

          # 毎回リモート最新から作り直すので、Claudeのpushと衝突しない
          for i in 1 2 3 4 5; do
            git fetch -q origin main
            git reset -q --hard origin/main

            mkdir -p results
            cp -f staging/*.json results/ 2>/dev/null || true

            # リモートに新しい結果が増えていた場合に備えてindexを作り直す
            python3 - <<'PY'
          import json, glob, os, re
          dates = sorted(
              [os.path.basename(p)[:-5] for p in glob.glob("results/*.json")
               if re.fullmatch(r"\d{8}", os.path.basename(p)[:-5])],
              reverse=True,
          )
          json.dump({"dates": dates}, open("results/index.json", "w"))
          PY

            git add -A results/
            if git diff --cached --quiet; then
              echo "集計対象なし"
              exit 0
            fi

            git commit -q -m "results: $(TZ=Asia/Tokyo date +%Y-%m-%d) 結果集計"
            if git push -q origin main; then
              echo "push成功"
              exit 0
            fi
            echo "リモートが進んでいたので作り直して再試行 ($i/5)"
            sleep $((i * 5))
          done
          echo "5回試行しても push できませんでした"
          exit 1
