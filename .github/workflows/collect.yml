name: collect

# 当日の出走表を収集して data/ にコミットする。
# 朝5時(JST)に走らせ、6:30のClaude予想タスクが git pull で受け取る。
# Macの状態に依存しないので、Claudeが動かなくてもデータだけは揃う。
on:
  workflow_dispatch:
  schedule:
    # 20:00 UTC = 翌05:00 JST（GitHubのcronは遅延することがあるため余裕を持たせる）
    - cron: "0 20 * * *"

permissions:
  contents: write

concurrency:
  group: race-scout-write
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 出走表を収集
        run: |
          DATE=$(TZ=Asia/Tokyo date +%Y%m%d)
          echo "収集対象: $DATE"
          # 全種別「開催なし」でも終了コード1で落ちるだけなので握りつぶす
          python3 scrape.py "$DATE" || echo "(一部または全種別で開催なし)"

      - name: 古いデータを整理（直近5日分のみ保持）
        run: |
          ls -1 data/*.json 2>/dev/null | sed 's/.*\///; s/_.*//' | sort -u | head -n -5 \
            | while read -r d; do echo "削除: $d"; rm -f "data/${d}_"*.json; done || true

      - name: コミットして push
        run: |
          git config user.name "race-scout-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A data/
          if git diff --cached --quiet; then
            echo "変更なし"
            exit 0
          fi
          git commit -m "data: $(TZ=Asia/Tokyo date +%Y-%m-%d) 出走表収集"
          # Claudeの予想pushと衝突した場合に備えてリベースして再試行
          for i in 1 2 3; do
            git pull --rebase --autostash origin main && git push origin main && exit 0
            echo "push失敗、リトライ $i"
            sleep 5
          done
          exit 1
