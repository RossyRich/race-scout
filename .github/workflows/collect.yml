name: collect

# 当日の出走表を収集して data/ にコミットする。
# 朝5時(JST)に走らせ、6:30のClaude予想タスクが git pull で受け取る。
# Macの状態に依存しないので、Claudeが動かなくてもデータだけは揃う。
#
# 4種別を並列ジョブで収集する。直列だと約50分かかり（ボートが1場2分×16場で
# 最も重い）、実測でタイムアウトしたため。並列化で実時間はボート分だけになる。
on:
  workflow_dispatch:
  schedule:
    # 20:00 UTC = 翌05:00 JST（GitHubのcronは遅延することがあるため余裕を持たせる）
    - cron: "0 20 * * *"

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      # 1種別が失敗しても他は続行する（開催なしの種別があるのは正常）
      fail-fast: false
      matrix:
        type: [keiba, keirin, boat, auto]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: ${{ matrix.type }} を収集
        run: |
          DATE=$(TZ=Asia/Tokyo date +%Y%m%d)
          echo "収集対象: $DATE / ${{ matrix.type }}"
          # 開催なしなら終了コード1で落ちるだけなので握りつぶす
          python3 scrape.py "$DATE" "${{ matrix.type }}" || echo "(${{ matrix.type }}の開催なし)"

      - uses: actions/upload-artifact@v4
        with:
          name: data-${{ matrix.type }}
          path: data/*.json
          # 開催なしの種別はファイルが出ないので、無くてもエラーにしない
          if-no-files-found: ignore
          retention-days: 1

  commit:
    needs: scrape
    # 一部の種別が失敗しても、取れた分はコミットする
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: race-scout-write
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: data-*
          path: data/
          merge-multiple: true

      - name: 収集結果を確認
        run: ls -la data/ || echo "(データなし)"

      - name: 古いデータを整理（直近5日分のみ保持）
        run: |
          ls -1 data/*.json 2>/dev/null | sed 's/.*\///; s/_.*//' | sort -u | head -n -5 \
            | while read -r d; do echo "削除: $d"; rm -f "data/${d}_"*.json; done || true

      - name: コミットして push
        run: |
          git config user.name "race-scout-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A data/
          if git diff --cached --quiet; then
            echo "変更なし"
            exit 0
          fi
          git commit -m "data: $(TZ=Asia/Tokyo date +%Y-%m-%d) 出走表収集"
          # Claudeの予想pushと衝突した場合に備えてリベースして再試行
          for i in 1 2 3; do
            git pull --rebase --autostash origin main && git push origin main && exit 0
            echo "push失敗、リトライ $i"
            sleep 5
          done
          exit 1
